<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记账本 · 首页</title>
  <style>
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', 'Hiragino Sans GB', 'Microsoft Yahei', Arial, 'Noto Sans', sans-serif; background:#fffbe6; }
    header { background:#ffec99; padding:24px; box-shadow:0 2px 10px 0 #ffdb5070; }
    h1 { margin:0; color:#7d5200; }
    main { max-width:960px; margin:32px auto; background:#fff; border:1px solid #ffe066; border-radius:10px; padding:24px; }
    a.btn { display:inline-block; padding:10px 16px; background:#ffc107; color:#4d3800; border-radius:24px; text-decoration:none; margin-right:12px; }
    .muted { color:#666; }
  </style>
</head>
<body>
  <header>
    <h1>记账本 · 后端静态主页</h1>
  </header>
  <main>
    <p class="muted">这是后端提供的静态首页（用于健康检查和占位）。推荐通过前端 Vue 应用访问现代化界面。</p>
    <p>
      <a class="btn" href="/api/health" target="_blank">API 健康检查</a>
      <a class="btn" href="/" >返回首页</a>
    </p>
    <p class="muted">前端开发服务器运行后，请访问其本地地址（如 http://localhost:5173 ）查看现代化记账首页。</p>
  </main>
</body>
</html>
